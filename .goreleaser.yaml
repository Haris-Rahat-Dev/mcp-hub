version: 2
project_name: mcp-hub

builds:
  - id: mcp-hub
    main: ./cmd/mcp-hub
    binary: mcp-hub
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64

  - id: mcp-hub-bridge
    main: ./cmd/mcp-hub-bridge
    binary: mcp-hub-bridge
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64

archives:
  - id: mcp-hub-archive
    ids:
      - mcp-hub
    format: tar.gz
    name_template: >-
      {{ .Binary }}_
      {{- .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
    format_overrides:
      - goos: windows
        format: zip
  - id: mcp-hub-bridge-archive
    ids:
      - mcp-hub-bridge
    format: tar.gz
    name_template: >-
      {{ .Binary }}_
      {{- .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
    format_overrides:
      - goos: windows
        format: zip

checksum:
  name_template: 'checksums.txt'

snapshot:
  name_template: "{{ incpatch .Version }}-snapshot"

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
